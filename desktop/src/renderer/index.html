<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>WikiDo</title>
    <!--
      CSP: tightly scoped to self + the two font CDNs the design CSS imports
      (jsDelivr for Pretendard, Google Fonts for IBM Plex Mono). Move to
      self-hosted fonts before shipping.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com data:; img-src 'self' data:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
