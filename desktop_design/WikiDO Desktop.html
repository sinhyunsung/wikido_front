<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WikiDO — 회계사 위키 데스크톱</title>
  <link rel="stylesheet" href="desktop-styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="desktop-shell.jsx"></script>
  <script type="text/babel" src="desktop-editor.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [tabs, setTabs] = useState(window.INITIAL_TABS);
      const [panels, setPanels] = useState({ left: true, right: true });
      const [alertCount, setAlertCount] = useState(2);
      const activeName = (tabs.find(t => t.id === 't1') || tabs[0])?.name || '';

      const wsClass = "workspace" + (panels.left ? '' : ' no-left') + (panels.right ? '' : ' no-right');

      return (
        <div className="desktopApp" data-screen-label="Editor — 한미산업 2025 감사조서">
          <TitleBar title={activeName} panels={panels} setPanels={setPanels} />
          <MenuBar />
          <div className={wsClass}>
            {panels.left ? <LeftExplorer alertCount={alertCount} /> : <div />}
            <div className="gutter" />
            <EditorPanel tabs={tabs} setTabs={setTabs} />
            <div className="gutter" />
            {panels.right ? <RightContext /> : <div />}
          </div>
          <StatusBar />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
